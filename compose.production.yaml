# Standalone web-only production stack. Do not merge with compose.next.yaml.
name: unibot-web
x-logs: &logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-app: &app
  image: ${APP_IMAGE:?create private production env}
  build:
    context: .
    dockerfile: Dockerfile.next
  environment: &app-env
    APP_ENV: production
    RELEASE_MODE: web-only
    DATABASE_URL: postgres://unibot_app:${APP_DB_PASSWORD:?create private production env}@db:5432/unibot_web?sslmode=disable
    DB_POOL_MAX: '6'
    APP_KEY: ${APP_KEY:?create private production env}
    APP_ORIGIN: ${APP_ORIGIN:?create private production env}
    PRIVATE_FILE_DIR: /files
    TELEGRAM_BOT_TOKEN: ''
    TELEGRAM_WEBHOOK_SECRET: ''
    TELEGRAM_SEND_ENABLED: 'false'
    TELEGRAM_RICH_ENABLED: 'false'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  logging: *logs
  mem_limit: 384m
  cpus: 1.0
  pids_limit: 64
  networks: [database]
services:
  db:
    image: &postgres postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: unibot_web
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create private production env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?create private production env}
    command: [postgres, -c, max_connections=32, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_wal_size=512MB]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/10-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d unibot_web']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logs
    shm_size: 128m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
  volume-init:
    # Only this offline operation changes ownership of NEW named volumes.
    image: *postgres
    profiles: [ops]
    entrypoint: [/bin/sh, -ec]
    command: ['chown 65532:65532 /files /caddy-data /caddy-config; chmod 700 /files /caddy-data /caddy-config']
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes: [private_files:/files, caddy_data:/caddy-data, caddy_config:/caddy-config]
    restart: 'no'
    logging: *logs
    mem_limit: 64m
    pids_limit: 32
  backup-files:
    image: *postgres
    profiles: [ops]
    entrypoint: [tar]
    command: [-czf, '-', -C, /files, .]
    user: '65532:65532'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [private_files:/files:ro]
    restart: 'no'
    logging: *logs
    mem_limit: 64m
    pids_limit: 32
  migrate:
    <<: *app
    profiles: [ops]
    command: [-mode, migrate]
    restart: 'no'
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?create private production env}@db:5432/unibot_web?sslmode=disable
      DB_POOL_MAX: '2'
  api:
    <<: *app
    command: [-mode, api]
    networks: [database, web]
    volumes: [private_files:/files]
    depends_on:
      db: {condition: service_healthy}
  scheduler:
    <<: *app
    command: [-mode, scheduler]
    environment:
      <<: *app-env
      DB_POOL_MAX: '2'
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      db: {condition: service_healthy}
  caddy:
    # Official multi-architecture manifest resolved 2026-11-11 (amd64/arm64: 2.11.9).
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    user: '65532:65532'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?create private production env}
    ports: ['80:8080', '443:8443']
    volumes:
      - ./infra/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      # The scratch API intentionally has no shell; probe it from the proxy.
      test: [CMD, wget, -q, -O, /dev/null, 'http://api:8080/readyz']
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 15s
    depends_on: [api]
    logging: *logs
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
volumes:
  postgres_data:
  private_files:
  caddy_data:
  caddy_config:
networks:
  database:
    internal: true
  web:
