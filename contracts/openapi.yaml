        in: query
        required: true
        schema:
          type: string
          enum:
          - channels
          - market
          - lost
          - found
      - name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Private role-checked result; at most 11 rows (10 plus next-page
