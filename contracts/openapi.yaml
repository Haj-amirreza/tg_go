  /api/v1/admin/tickets/reply:
    post:
      operationId: replyToSupportTicket
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Atomic idempotent mutation; revisions checked; notifications
            commit with outbox
        '400':
          description: Invalid fields, missing consent or unverified student
        '403':
          description: Required domain permission missing
        '409':
          description: Revision changed; refresh before editing
  /api/v1/admin/community/save:
