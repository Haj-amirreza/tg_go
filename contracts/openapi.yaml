openapi: 3.1.0
info:
  title: University Bot Foundation API
  version: 0.5.0
  description: Go domain migration in progress; catalog, announcements and portable block studio. Production cutover remains gated.
paths:
  /healthz:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive; this does not imply database readiness.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: alive } } }
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: Database reachable and foundation migration verified }
        '503': { description: Database unavailable or foundation migration missing or changed }
  /api/v1/system/status:
    get:
      operationId: systemStatus
      responses:
        '200':
          description: Public foundation capabilities, without credentials or operational records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
  /api/v1/auth/csrf:
    get:
      operationId: loginCsrf
      responses:
        '200':
          description: Sets HttpOnly pre-login cookie; token expires in 10 minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CSRF' }
  /api/v1/auth/login:
    post:
      operationId: passwordLogin
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Denied' }
        '403': { $ref: '#/components/responses/Denied' }
        '429': { $ref: '#/components/responses/Denied' }
        '503': { $ref: '#/components/responses/Denied' }
  /api/v1/auth/telegram:
    post:
      operationId: telegramLogin
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Denied' }
        '403': { $ref: '#/components/responses/Denied' }
        '429': { $ref: '#/components/responses/Denied' }
        '503': { $ref: '#/components/responses/Denied' }
  /api/v1/admin/session:
    get:
      operationId: adminSession
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Denied' }
        '503': { $ref: '#/components/responses/Denied' }
  /api/v1/admin/logout:
    post:
      operationId: adminLogout
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200':
          description: Session revoked in PostgreSQL and cookie expired.
          content:
            application/json:
              schema: { type: object, required: [loggedOut], properties: { loggedOut: { const: true } } }
        '401': { $ref: '#/components/responses/Denied' }
        '403': { $ref: '#/components/responses/Denied' }
  /api/v1/admin/roles:
    get:
      operationId: listVisibleRoles
      description: Requires admins permission. Non-super actors see weaker roles only; read-only in this stage.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: At most 100 visible roles; no password hashes or TOTP secrets.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Denied' }
        '403': { $ref: '#/components/responses/Denied' }
  /api/v1/admin/queue/jobs:
    get:
      operationId: listQueueJobs
      security: [{cookieAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string}}
      responses:
        '200':
          description: Up to 20 jobs, keyset pagination, no payload or recipient. Requires queue permission.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/QueueItem'}}
        '403': {$ref: '#/components/responses/Denied'}
  /api/v1/admin/queue/retry:
    post:
      operationId: retryDeadJob
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [id], properties: {id: {type: string}}}
      responses:
        '200': {description: Dead job reset in an audited transaction}
        '403': {$ref: '#/components/responses/Denied'}
        '409': {description: Job not dead; uncertain deliveries cannot be automatically replayed}
  /api/v1/admin/performance:
    get:
      operationId: performance
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Non-sensitive process counters and one-second queue aggregate; requires health permission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Performance'}
        '403': {$ref: '#/components/responses/Denied'}
  /api/v1/admin/cache/clear:
    post:
      operationId: clearPublicCache
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200': {description: Public aggregate cache cleared; requires health permission}
        '403': {$ref: '#/components/responses/Denied'}
  /api/v1/admin/queue/control:
    post:
      operationId: pauseQueue
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [paused], properties: {paused: {type: boolean}}}
      responses:
        '200': {description: Pause flag committed and audited; requires queue permission}
        '403': {$ref: '#/components/responses/Denied'}
  /api/v1/telegram/webhook:
    post:
      operationId: acceptUpdate
      parameters:
        - {name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: {type: string, minLength: 32}}
      responses:
        '200': {description: Update and outbox committed, or already accepted}
        '400': {description: Invalid JSON update identifier}
        '403': {description: Invalid secret}
        '413': {description: More than 1 MiB}
        '503': {description: Disabled or durable storage unavailable}
  /api/v1/admin/catalog:
    get:
      operationId: listCatalog
      security: [{cookieAuth: []}]
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Up to 20 records; requires content permission.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Content'}}
  /api/v1/admin/catalog/save:
    post:
      operationId: saveCatalog
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/CommandKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Content'}
      responses:
        '200':
          description: Committed version, including idempotent replay. Published changes require publish permission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Content'}
        '409': {$ref: '#/components/responses/Denied'}
  /api/v1/admin/catalog/archive:
    post:
      operationId: archiveCatalog
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/CommandKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [items], properties: {items: {type: array, minItems: 1, maxItems: 100, items: {type: object, required: [id, version], properties: {id: {type: string}, version: {type: integer}}}}}}
      responses:
        '200': {description: Atomic archive; IDs and revisions retained.}
  /api/v1/admin/books:
    get:
      operationId: listBooks
      security: [{cookieAuth: []}]
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
      responses:
        '200':
          description: At most 10 books, with normalized Persian AND search.
          content:
            application/json:
              schema: {type: object, required: [rows, page, pages, total], properties: {rows: {type: array, items: {$ref: '#/components/schemas/Book'}}, page: {type: integer}, pages: {type: integer}, total: {type: integer}}}
  /api/v1/admin/books/save:
    post:
      operationId: saveBook
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/CommandKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Book'}
      responses:
        '200':
          description: Book committed with optimistic revision check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
  /api/v1/admin/books/archive:
    post:
      operationId: archiveBooks
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/CommandKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [id, revision], properties: {id: {type: string}, revision: {type: integer}}}}}}
      responses:
        '200': {description: Soft deletion of selected books; source keys retained.}
  /api/v1/admin/books/categories:
    get:
      operationId: bookCategories
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Ten stable categories.
          content:
            application/json:
              schema: {type: array, items: {type: object, required: [id, name], properties: {id: {type: string}, name: {type: string}}}}
  /api/v1/admin/studio:
    get:
      operationId: getStudio
      security:
      - cookieAuth: []
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      responses:
        '200':
          description: Role-checked private domain result; no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/admin/studio/templates:
    get:
      operationId: listStudioTemplates
      security:
      - cookieAuth: []
      parameters: []
      responses:
        '200':
          description: Role-checked private domain result; no-store
