  /api/v1/admin/files/upload:
    post:
      operationId: uploadPrivateMedia
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Private file ID and verified MIME, max 20 MiB
        '413':
          description: Too large
        '403':
          description: Files permission and CSRF required

  /api/v1/admin/tickets:
    get:
      operationId: listSupportTickets
      security:
      - cookieAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
      - name: state
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Private role-checked result; at most 11 rows (10 plus next-page
            sentinel), or 5 thread messages. Verification details require users permission.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items:
                    type: object
                    additionalProperties: true
        '403':
          description: Required domain permission missing
  /api/v1/admin/tickets/thread:
    get:
      operationId: getSupportThread
      security:
      - cookieAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
