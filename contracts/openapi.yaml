components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: unibot_session }
  parameters:
    CommandKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 64}}
    CSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
  responses:
    Session:
      description: Current identity and CSRF token. Bearer remains in HttpOnly cookie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Actor' }
    Denied:
      description: Generic denial, throttling or service unavailable; does not reveal whether the account exists.
      content:
        application/json:
          schema: { type: object, required: [code], properties: { code: { type: string } } }
  schemas:
    Content:
      type: object
      required: [id, kind, title, body, metadata, status, version, publishedAt, expiresAt]
      properties:
        id: {type: string}
        kind: {type: string}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, maxLength: 30000}
        metadata: {type: object, additionalProperties: true}
        status: {type: string, enum: [draft, pending, published, archived]}
        version: {type: integer}
        publishedAt: {type: [integer, 'null']}
        expiresAt: {type: [integer, 'null']}
    Book:
      type: object
      required: [id, title, details, category, revision]
      properties:
        id: {type: string}
        title: {type: string}
        details: {type: object, additionalProperties: true}
        category: {type: string}
        revision: {type: integer}
    QueueItem:
      type: object
      required: [id, kind, state, attempts, error]
      properties:
        id: {type: string}
        kind: {type: string}
        state: {type: string}
        attempts: {type: integer}
        error: {type: [string, 'null']}
    Performance:
      type: object
      required: [queue, database, pool, cache, heapBytes, goroutines, queueSnapshotSeconds]
      properties:
        queue: {type: object, additionalProperties: {type: integer}}
        database: {type: object, additionalProperties: {type: integer}}
        pool: {type: object, additionalProperties: {type: integer}}
        cache:
          type: object
          required: [hits, misses, entries, bytes]
          properties:
            hits: {type: integer}
            misses: {type: integer}
            entries: {type: integer}
            bytes: {type: integer}
        cpuMicros: {type: integer, description: Cumulative process user plus system CPU microseconds; Linux runtime.}
        heapBytes: {type: integer}
        goroutines: {type: integer}
        queueSnapshotSeconds: {type: integer}
    CSRF:
      type: object
      required: [csrf]
      properties:
        csrf: { type: string }
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password, otp]
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        password: { type: string, minLength: 1, maxLength: 72 }
        otp: { type: string, description: Six ASCII digits when TOTP is enabled; otherwise empty. }
    TelegramInput:
      type: object
      additionalProperties: false
      required: [grant, initData, otp]
      properties:
        grant: { type: string, pattern: '^[a-f0-9]{64}$' }
        initData: { type: string, maxLength: 16384 }
        otp: { type: string }
    Actor:
      type: object
      additionalProperties: false
      required: [id, username, name, role, level, super, permissions, csrf]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]*$' }
        username: { type: string }
        name: { type: string }
        role: { type: string }
        level: { type: integer }
        super: { type: boolean }
        permissions: { type: array, items: { type: string } }
        csrf: { type: string }
    Role:
      type: object
      required: [id, name, level, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        level: { type: integer }
        permissions: { type: array, items: { type: string } }

    SystemStatus:
      type: object
      additionalProperties: false
      required: [service, stage, environment, databaseReady, authenticationReady, botConnected]
      properties:
        service: { const: university-bot }
        stage: { const: 4 }
        environment: { type: string, enum: [development, test, production] }
        databaseReady: { type: boolean }
        authenticationReady: { type: boolean }
        botConnected: { type: boolean }
