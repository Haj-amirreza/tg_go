      - name: mode
        in: query
        required: true
        schema:
          type: string
          enum:
          - bank
          - all
          - followers
      responses:
        '200':
          description: Role-checked private domain result; no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/admin/notices/dispatches:
    get:
