          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/admin/studio/save:
    post:
      operationId: saveStudio
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Atomic, idempotent command result
        '400':
          description: Invalid fields, unsupported media or audience above 1500
        '409':
          description: Stale revision, changed audience or duplicate dispatch
  /api/v1/admin/studio/template:
    post:
      operationId: saveStudioTemplate
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/CommandKey'
      requestBody:
